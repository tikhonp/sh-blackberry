services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/backup:/host/disks/backup:ro
      - /proc:/host/proc:ro
    environment:
      - TZ=${TZ}
      - DOZZLE_HOSTNAME=blackberry
      - DOZZLE_NO_ANALYTICS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      retries: 5
      start_period: 5s
      start_interval: 5s
    secrets:
      - source: cert
        target: /dozzle_cert.pem
      - source: key
        target: /dozzle_key.pem
    network_mode: service:ts-dozzle
    depends_on:
      - ts-dozzle
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    labels:
      - dev.dozzle.group=dozzle
      - dev.dozzle.update=auto

  ts-dozzle:
    image: tailscale/tailscale:${TAILSCALE_V}
    container_name: ts-dozzle
    hostname: blackberry-ts-dozzle
    env_file: 
      - ./secrets/headscale.env
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ts-dozzle-state:/var/lib/tailscale
    tmpfs:
      - /tmp
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    labels:
      - dev.dozzle.group=dozzle
      - dev.dozzle.update=auto

volumes:
  ts-dozzle-state:
    name: "blackberry-ts-dozzle-state"

secrets:
  cert:
    file: ./secrets/dozzle-certs/dozzle_cert.pem
  key:
    file: ./secrets/dozzle-certs/dozzle_key.pem
