services:
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:1.37.4
    volumes:
      - "${VAULTWARDEN_DATA}:/data/"
    restart: unless-stopped
    env_file: 
      - ./secrets/blackberry/vaultwarden.env
    expose:
      - 80
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    labels:
      - dev.dozzle.group=vaultwarden

  ssht-vaultwarden:
    image: jnovack/autossh:${AUTOSSH_V}
    container_name: ssht-vaultwarden
    restart: unless-stopped
    env_file: 
      - ./secrets/ssh-tunnel.env
    environment:
      - SSH_OPTIONS=-o UserKnownHostsFile=/dev/null
      - SSH_TUNNEL_PORT=10006
      - SSH_TARGET_HOST=vaultwarden
      - SSH_TARGET_PORT=80
    volumes:
      - "./secrets/ssh-key:/id_rsa:ro"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "^/usr/bin/ssh "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - vaultwarden
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    labels:
      - dev.dozzle.group=vaultwarden
      - "dev.dozzle.icon=${DOZZLE_ICON_AUTOSSH}"
